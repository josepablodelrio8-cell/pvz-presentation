<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Plants vs Zombies — Game Components</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<!-- AOS for scroll animations -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#061000;}

/* INTRO */
#intro{position:fixed;inset:0;z-index:9999;background:#061000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 1s ease;}
#intro.out{opacity:0;pointer-events:none;}
.intro-logo{max-width:min(460px,85vw);animation:logoPop .8s cubic-bezier(.34,1.56,.64,1);}
@keyframes logoPop{from{transform:scale(.2)rotate(-10deg);opacity:0;}to{transform:scale(1)rotate(0);opacity:1;}}
.lbar-outer{width:min(380px,75vw);height:22px;background:#0a1a00;border:3px solid #5cb800;border-radius:20px;overflow:hidden;}
.lbar-inner{height:100%;width:0%;background:linear-gradient(90deg,#3a8a00,#7fff00,#3a8a00);background-size:200%;animation:lshine 1s linear infinite;transition:width .15s;border-radius:17px;}
@keyframes lshine{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.ltext{font-family:'Fredoka One',cursive;font-size:clamp(.8rem,2.5vw,.95rem);color:#7fff00;letter-spacing:1px;}

/* APP */
#app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* NAV */
#nav{flex-shrink:0;height:46px;background:rgba(4,10,0,.97);border-bottom:3px solid #5cb800;display:flex;align-items:center;padding:0 8px;gap:4px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
#nav::-webkit-scrollbar{display:none;}
.nav-logo{height:30px;object-fit:contain;cursor:pointer;flex-shrink:0;margin-right:4px;}
.nb{font-family:'Fredoka One',cursive;font-size:.66rem;background:rgba(255,255,255,.06);border:1.5px solid rgba(92,184,0,.35);color:#c8f58a;border-radius:20px;padding:3px 9px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.nb:hover,.nb.on{background:#5cb800;color:#040a00;border-color:#5cb800;font-weight:900;}
.nav-r{margin-left:auto;display:flex;gap:4px;align-items:center;flex-shrink:0;}
.nbx{font-family:'Fredoka One',cursive;font-size:.62rem;border-radius:20px;padding:3px 8px;cursor:pointer;border:1.5px solid;transition:all .15s;white-space:nowrap;}
.music-nb{background:rgba(255,200,0,.1);border-color:#FFD700;color:#FFD700;}
.music-nb.on{background:#FFD700;color:#040a00;animation:mPulse 2s infinite;}
@keyframes mPulse{0%,100%{box-shadow:0 0 4px rgba(255,215,0,.4);}50%{box-shadow:0 0 14px rgba(255,215,0,.8);}}
.ap-nb{background:rgba(229,57,53,.15);border-color:#e53935;color:#ff8a80;}
.ap-nb.on{background:#e53935;color:#fff;}
.lang-nb{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff;}
.fs-nb{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:#aaa;}

/* SCREENS */
.scr{display:none;flex:1;overflow:hidden;flex-direction:column;min-height:0;}
.scr.active{display:flex;}

/* ══════════════ MENU ══════════════ */
#s-menu{position:relative;overflow:hidden;}
.menu-bg-img{position:absolute;inset:0;background-size:cover;background-position:center top;z-index:0;}

/* Sun counter */
.sun-ctr{position:absolute;top:8px;left:8px;z-index:30;display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,.65);border:2.5px solid #FFD700;border-radius:22px;padding:4px 12px;
  box-shadow:0 0 12px rgba(255,215,0,.35);}
.sun-val{font-family:'Fredoka One',cursive;font-size:clamp(1rem,3vw,1.3rem);color:#FFD700;}

/* Dave area — bottom-left */
.dave-area{position:absolute;bottom:clamp(14%,20%,26%);left:0;z-index:20;display:flex;align-items:flex-end;gap:0;
  max-width:clamp(200px,40vw,320px);}
.dave-bubble{background:#fffde7;border:2.5px solid #4CAF50;border-radius:16px 16px 16px 4px;
  padding:8px 12px;font-size:clamp(.56rem,1.3vw,.75rem);color:#1a5c00;line-height:1.55;
  margin-bottom:8px;box-shadow:3px 3px 0 rgba(0,0,0,.25);position:relative;
  max-width:clamp(130px,24vw,200px);}
.dave-bubble::after{content:'';position:absolute;bottom:-11px;left:14px;
  border:6px solid transparent;border-top-color:#4CAF50;}
.dave-img{height:clamp(100px,18vw,185px);width:auto;object-fit:contain;
  filter:drop-shadow(3px 5px 10px rgba(0,0,0,.65));
  animation:dBob 2s ease-in-out infinite;transform-origin:bottom center;flex-shrink:0;}
@keyframes dBob{0%,100%{transform:translateY(0)rotate(-3deg);}50%{transform:translateY(-10px)rotate(3deg);}}

/* Menu buttons — perfectly centered on tombstone face */
/* Tombstone is in right 40% of image, face area ~55-85% height */
.tomb-menu{position:absolute;z-index:20;
  right:clamp(2%,5vw,8%);
  top:50%;transform:translateY(-50%);
  width:clamp(130px,22vw,200px);
  display:flex;flex-direction:column;gap:clamp(4px,.8vw,8px);}
.tm-btn{font-family:'Fredoka One',cursive;
  font-size:clamp(.62rem,1.6vw,.9rem);
  border-radius:6px;padding:clamp(6px,1vw,11px) 8px;
  cursor:pointer;transition:all .18s;text-align:center;width:100%;
  letter-spacing:.3px;}
.tm-btn.main{background:rgba(5,45,2,.9);border:2.5px solid #7fff00;color:#7fff00;
  font-size:clamp(.7rem,1.8vw,1rem);}
.tm-btn.main:hover{background:rgba(10,80,5,.95);box-shadow:0 0 16px rgba(127,255,0,.5);transform:scale(1.04);}
.tm-btn.sec{background:rgba(10,12,6,.82);border:1.5px solid rgba(160,210,140,.35);color:#c8e6c9;}
.tm-btn.sec:hover{background:rgba(15,50,10,.88);border-color:#5cb800;color:#7fff00;transform:scale(1.03);}

/* Zombies walking */
.zwalker{position:absolute;z-index:7;bottom:clamp(14%,20%,25%);animation:zwalk linear infinite;}
.zwalker img{height:clamp(50px,8vw,82px);object-fit:contain;filter:drop-shadow(2px 2px 5px rgba(0,0,0,.6));}
@keyframes zwalk{from{right:-100px;}to{right:110%;}}

/* Sun drops */
.sun-drop{position:absolute;z-index:13;cursor:pointer;animation:sDrop linear forwards;pointer-events:all;}
.sun-drop span{font-size:clamp(1.8rem,4vw,2.6rem);display:block;animation:sSpin 3s linear infinite;}
@keyframes sDrop{0%{top:-60px;opacity:1;}100%{top:105%;opacity:.3;}}
@keyframes sSpin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

/* Bottom info bar */
.menu-foot{position:absolute;bottom:0;left:0;right:0;z-index:25;
  background:rgba(0,0,0,.78);padding:4px 10px;
  font-size:clamp(.5rem,1.2vw,.65rem);color:#d4f58a;
  display:flex;justify-content:center;align-items:center;gap:clamp(6px,2vw,18px);flex-wrap:wrap;}
.mf-key{color:#7fff00;font-weight:900;}

/* ══════════════ MAP ══════════════ */
#s-map{background:#0d1f00;overflow:hidden;}
.map-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.38);}
.map-scroll{position:relative;z-index:5;height:100%;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;padding:10px 12px 14px;}
.map-logo{max-height:clamp(46px,8vw,74px);object-fit:contain;margin-bottom:8px;}
.map-hint{font-family:'Fredoka One',cursive;font-size:clamp(.68rem,1.7vw,.9rem);
  color:#d4f58a;margin-bottom:10px;text-align:center;}
.road{display:flex;justify-content:center;gap:clamp(8px,2vw,22px);width:100%;max-width:820px;flex-wrap:wrap;}
.wnode{display:flex;flex-direction:column;align-items:center;cursor:pointer;
  transition:transform .22s;min-width:86px;}
.wnode:hover{transform:translateY(-9px) scale(1.07);}
.wnode-circle{width:clamp(58px,10vw,86px);height:clamp(58px,10vw,86px);border-radius:50%;
  border:3px solid;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.55);position:relative;}
.wnode-circle img{width:100%;height:100%;object-fit:cover;}
.wnode-badge{position:absolute;top:2px;right:2px;font-size:.85rem;}
.boss-glow{animation:bGlow 1.2s ease-in-out infinite;}
@keyframes bGlow{0%,100%{box-shadow:0 0 6px rgba(239,68,68,.4);}50%{box-shadow:0 0 24px rgba(239,68,68,.95);}}
.wnode-name{font-family:'Fredoka One',cursive;font-size:clamp(.62rem,1.4vw,.85rem);margin-top:5px;text-align:center;}
.wnode-lvl{font-size:.58rem;color:#94a3b8;text-align:center;}
.map-infobox{background:rgba(0,0,0,.7);border:1.5px solid rgba(92,184,0,.35);border-radius:10px;
  padding:8px 14px;font-size:clamp(.6rem,1.4vw,.74rem);color:#d1fae5;
  text-align:center;line-height:1.7;margin:10px 0;max-width:680px;width:100%;}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px;}
.chip{background:rgba(92,184,0,.18);border:1px solid #5cb800;color:#7fff00;
  font-size:.58rem;border-radius:8px;padding:1px 7px;font-weight:700;}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.mbtn{font-family:'Fredoka One',cursive;background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.2);border-radius:20px;padding:6px 14px;
  font-size:.73rem;color:#d1d5db;cursor:pointer;transition:all .15s;}
.mbtn:hover{color:#7fff00;border-color:#5cb800;}
.mbtn.p{background:#1a5c00;border-color:#7fff00;color:#fff;}
.mbtn.p:hover{background:#2d8a00;}

/* ══════════════ WORLD DETAIL ══════════════ */
#s-world{flex-direction:column;}
.wd-hero{flex-shrink:0;height:clamp(110px,26vw,210px);position:relative;overflow:hidden;}
.wd-hero img{width:100%;height:100%;object-fit:cover;display:block;}
.wd-hero-ov{position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 10%,rgba(0,0,0,.92) 100%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:10px 14px;}
.wd-htitle{font-family:'Fredoka One',cursive;font-size:clamp(1.1rem,3.5vw,1.9rem);
  color:#FFD700;text-shadow:2px 2px 0 #7a4500,3px 3px 0 #000;}
.wd-hsub{font-size:clamp(.62rem,1.5vw,.76rem);color:#d1fae5;margin-top:2px;}
.wd-body{flex:1;min-height:0;display:flex;overflow:hidden;}
.wd-main{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.wd-side{overflow-y:auto;padding:8px;border-left:1px solid rgba(255,255,255,.07);width:200px;flex-shrink:0;}
@media(max-width:560px){.wd-body{flex-direction:column;}.wd-side{width:100%;border-left:none;border-top:1px solid rgba(255,255,255,.07);max-height:200px;}}
.panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 12px;}
.pt{font-family:'Fredoka One',cursive;font-size:.83rem;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.pb{font-size:.74rem;color:#e2e8f0;line-height:1.65;}
.mech-item{display:flex;gap:6px;padding:4px 7px;background:rgba(255,255,255,.04);border-radius:6px;margin-bottom:3px;}
.mech-t{font-size:.71rem;color:#d4f58a;line-height:1.45;}
.ibox{background:rgba(26,46,0,.7);border:1.5px solid #3a7a00;border-radius:8px;padding:7px 10px;margin-bottom:5px;}
.ibox-t{font-size:.72rem;color:#d4f58a;line-height:1.5;}
.zs-lbl{font-family:'Fredoka One',cursive;font-size:.8rem;color:#fca5a5;margin-bottom:6px;}
.zcard-mini{background:rgba(70,0,0,.5);border:1.5px solid rgba(180,40,40,.4);border-radius:8px;padding:7px 8px;margin-bottom:6px;}
.zcm-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.zcm-img{width:28px;height:34px;object-fit:contain;object-position:top;flex-shrink:0;
  filter:drop-shadow(1px 1px 3px rgba(0,0,0,.6));}
.zcm-name{font-family:'Fredoka One',cursive;font-size:.76rem;color:#fca5a5;}
.zcm-desc{font-size:.65rem;color:#fecaca;line-height:1.4;}
.wd-foot{flex-shrink:0;background:rgba(0,0,0,.7);border-top:1px solid rgba(255,215,0,.2);
  padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.wdots{display:flex;gap:4px;}
.wdot{width:8px;height:8px;border-radius:50%;border:1.5px solid #4b5563;cursor:pointer;transition:all .15s;}
.wdot.on{background:#FFD700;border-color:#FFD700;transform:scale(1.3);}

/* ══════════════ ALMANAC ══════════════ */
#s-almanac{flex-direction:column;}
.alm-tabs{flex-shrink:0;display:flex;background:rgba(0,0,0,.88);border-bottom:2px solid #5cb800;padding:0 10px;}
.alm-tab{font-family:'Fredoka One',cursive;font-size:.78rem;padding:8px 16px;cursor:pointer;
  color:#4b5563;border-bottom:3px solid transparent;transition:all .15s;}
.alm-tab.on{color:#7fff00;border-color:#7fff00;}
.alm-body{flex:1;min-height:0;display:flex;overflow:hidden;}
.alm-list{width:clamp(115px,27%,180px);flex-shrink:0;overflow-y:auto;
  background:rgba(0,0,0,.55);border-right:1px solid rgba(255,255,255,.07);padding:5px;}
.alm-item{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:8px;
  cursor:pointer;transition:all .15s;margin-bottom:2px;}
.alm-item:hover{background:rgba(255,255,255,.06);}
.alm-item.on{background:rgba(92,184,0,.18);border:1px solid rgba(92,184,0,.4);}
.alm-img-box{width:34px;height:40px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;}
.alm-img-box img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));}
.alm-iname{font-family:'Fredoka One',cursive;font-size:.7rem;color:#d4f58a;line-height:1.2;}
.alm-detail{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}

/* Plant card */
.pd-card{background:#3d1800;border:3px solid #8B4513;border-radius:14px;overflow:hidden;}
.pd-header{background:linear-gradient(135deg,#5a2400,#3d1800);padding:12px 14px;
  display:flex;align-items:center;gap:12px;border-bottom:2px solid #6b2e10;}
.pd-imgbox{width:76px;height:86px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;background:rgba(0,0,0,.35);border-radius:8px;border:2px solid #6b2e10;}
.pd-imgbox img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));}
.pd-name{font-family:'Fredoka One',cursive;font-size:clamp(.95rem,2.5vw,1.3rem);
  color:#FFD700;text-shadow:1px 1px 3px rgba(0,0,0,.8);margin-bottom:5px;}
.pd-stats{display:flex;gap:5px;flex-wrap:wrap;}
.pd-stat{background:rgba(0,0,0,.5);border:1px solid #8B4513;border-radius:6px;padding:3px 8px;text-align:center;}
.pd-sl{font-size:.52rem;color:#fbbf24;font-weight:900;letter-spacing:.5px;}
.pd-sv{font-family:'Fredoka One',cursive;font-size:.78rem;color:#fff;}
.pd-body{padding:12px 14px;}
.pd-desc{font-size:clamp(.66rem,1.5vw,.78rem);color:#ffe8cc;line-height:1.65;margin-bottom:10px;}
.pd-abils{display:flex;flex-direction:column;gap:4px;}
.pd-abil{background:rgba(0,0,0,.3);border-left:3px solid #5cb800;
  border-radius:0 6px 6px 0;padding:5px 9px;font-size:.7rem;color:#d4f58a;line-height:1.4;}

/* Zombie card */
.zd-card{background:#1a0000;border:3px solid #7f1d1d;border-radius:14px;overflow:hidden;}
.zd-header{background:linear-gradient(135deg,#350000,#1a0000);padding:12px 14px;
  display:flex;align-items:center;gap:12px;border-bottom:2px solid #7f1d1d;}
.zd-imgbox{width:76px;height:96px;flex-shrink:0;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(0,0,0,.4);border-radius:8px;
  border:2px solid #7f1d1d;overflow:hidden;}
.zd-imgbox img{max-width:100%;max-height:100%;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 2px 8px rgba(255,0,0,.25));}
.zd-name{font-family:'Fredoka One',cursive;font-size:clamp(.95rem,2.5vw,1.25rem);
  color:#ff6b6b;text-shadow:1px 1px 3px rgba(0,0,0,.9);margin-bottom:5px;}
.zd-stats{display:flex;gap:5px;flex-wrap:wrap;}
.zd-stat{background:rgba(0,0,0,.5);border:1px solid #7f1d1d;border-radius:6px;padding:3px 7px;text-align:center;}
.zd-sl{font-size:.5rem;color:#f87171;font-weight:900;letter-spacing:.5px;}
.zd-sv{font-family:'Fredoka One',cursive;font-size:.75rem;color:#fca5a5;}
.zd-body{padding:12px 14px;}
.zd-desc{font-size:clamp(.65rem,1.4vw,.76rem);color:#fecaca;line-height:1.65;margin-bottom:8px;}
.zd-lbl{font-family:'Fredoka One',cursive;font-size:.7rem;color:#f87171;margin-bottom:4px;}
.zd-abils{display:flex;flex-direction:column;gap:4px;}
.zd-abil{background:rgba(0,0,0,.3);border-left:3px solid #ef4444;
  border-radius:0 6px 6px 0;padding:5px 9px;font-size:.7rem;color:#fca5a5;line-height:1.4;}
.chip-red{background:rgba(220,38,38,.15);border:1px solid #dc2626;color:#fca5a5;
  font-size:.58rem;border-radius:8px;padding:1px 7px;font-weight:700;}

/* ══════════════ BOSS ══════════════ */
#s-boss{flex-direction:column;background:#040008;}
.boss-hero{flex-shrink:0;height:clamp(130px,28vw,195px);
  background:linear-gradient(135deg,#0a0015,#18002e,#080010);
  border-bottom:3px solid #ef4444;position:relative;display:flex;align-items:center;overflow:hidden;}
/* Animated red lightning background */
.boss-hero::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 80% 50%,rgba(200,0,0,.25) 0%,transparent 70%);
  animation:bHeroPulse 2s ease-in-out infinite alternate;}
@keyframes bHeroPulse{from{opacity:.5;}to{opacity:1;}}
.boss-hero-txt{padding:14px 16px;flex:1;position:relative;z-index:2;}
.boss-title{font-family:'Fredoka One',cursive;
  font-size:clamp(1.5rem,5vw,3.4rem);
  color:#ff1744;text-shadow:2px 2px 0 #7f0000,4px 4px 0 #000;
  animation:tshk .5s ease-in-out infinite alternate;}
@keyframes tshk{from{transform:rotate(-1deg);}to{transform:rotate(1deg);}}
.boss-sub{font-family:'Fredoka One',cursive;font-size:clamp(.68rem,1.8vw,1.05rem);color:#ff9800;margin-top:4px;}
.boss-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.boss-badge{font-size:.6rem;border-radius:8px;padding:2px 8px;font-weight:700;
  background:rgba(239,68,68,.2);border:1px solid #ef4444;color:#fca5a5;}
.boss-zombot{height:100%;max-width:45%;object-fit:contain;margin-left:auto;position:relative;z-index:2;
  filter:drop-shadow(0 0 28px rgba(255,0,0,.65)) drop-shadow(0 0 55px rgba(200,0,0,.35));
  animation:zhov 2.5s ease-in-out infinite;}
@keyframes zhov{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.boss-scroll{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;}
@media(min-width:620px){.boss-scroll{flex-direction:row;flex-wrap:wrap;}}
.boss-l,.boss-r{flex:1;min-width:min(230px,100%);display:flex;flex-direction:column;gap:8px;}
.bcard{background:linear-gradient(135deg,rgba(65,0,0,.92),rgba(28,0,0,.96));
  border:2px solid #ef4444;border-radius:12px;padding:12px;}
.bc-title{font-family:'Fredoka One',cursive;font-size:.95rem;color:#ff4444;margin-bottom:6px;}
.bc-body{font-size:.72rem;color:#fecaca;line-height:1.65;margin-bottom:8px;}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px;}
.bst{background:rgba(0,0,0,.4);border:1px solid #dc2626;border-radius:6px;padding:4px 6px;text-align:center;}
.bst-l{font-size:.54rem;color:#f87171;font-weight:900;letter-spacing:.8px;}
.bst-v{font-family:'Fredoka One',cursive;font-size:.78rem;color:#ff4444;}
.batk-item{display:flex;gap:6px;margin-bottom:4px;font-size:.69rem;color:#fca5a5;line-height:1.5;align-items:flex-start;}
.how-to{background:linear-gradient(135deg,rgba(16,42,0,.94),rgba(36,70,10,.78));
  border:2px solid #7fff00;border-radius:10px;padding:10px 12px;}
.ht-title{font-family:'Fredoka One',cursive;font-size:.83rem;color:#7fff00;margin-bottom:6px;}
.ht-step{display:flex;align-items:flex-start;gap:5px;font-size:.68rem;color:#d4f58a;margin-bottom:3px;line-height:1.45;}
.sn{background:#5cb800;color:#000;border-radius:50%;width:14px;height:14px;
  display:flex;align-items:center;justify-content:center;font-size:.54rem;font-weight:900;flex-shrink:0;margin-top:1px;}
.gcard{background:linear-gradient(135deg,rgba(16,42,0,.92),rgba(36,70,10,.76));
  border:2px solid #7fff00;border-radius:12px;padding:12px;}
.gcard-title{font-family:'Fredoka One',cursive;font-size:.95rem;color:#7fff00;margin-bottom:6px;}
.gcard-body{font-size:.72rem;color:#d4f58a;line-height:1.65;}

/* ══════════════ VICTORY ══════════════ */
#s-victory{flex-direction:column;background:#030a00;}
.vict-scroll{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:10px;}
@keyframes vGlow{from{text-shadow:2px 2px 0 #7a4500,0 0 10px rgba(255,215,0,.3);}to{text-shadow:2px 2px 0 #7a4500,0 0 30px rgba(255,215,0,.7);}}
@keyframes dBobV{0%,100%{transform:translateY(0)rotate(-2deg);}50%{transform:translateY(-8px)rotate(2deg);}}
.vcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:10px;}
.vcard{background:rgba(255,255,255,.04);border:1.5px solid rgba(255,215,0,.25);border-radius:12px;padding:12px 14px;}
.vcard.green{border-color:#5cb800;background:rgba(20,50,5,.55);}
.vcard.blue{border-color:rgba(99,102,241,.5);background:rgba(5,10,30,.88);}
.vcard-title{font-family:'Fredoka One',cursive;font-size:.9rem;color:#FFD700;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.tl{display:flex;flex-direction:column;gap:6px;}
.tl-item{display:flex;gap:9px;align-items:flex-start;background:rgba(0,0,0,.3);border-radius:8px;padding:7px 9px;}
.tl-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.68rem;font-weight:900;flex-shrink:0;color:#040a00;}
.tl-head{font-family:'Fredoka One',cursive;font-size:.74rem;margin-bottom:2px;}
.tl-txt{font-size:.67rem;line-height:1.5;}
.unlocks{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.uitem{border:1.5px solid;border-radius:10px;padding:8px;text-align:center;}
.uitem-icon{font-size:1.3rem;margin-bottom:2px;}
.uitem-name{font-family:'Fredoka One',cursive;font-size:.68rem;margin-bottom:1px;}
.uitem-desc{font-size:.58rem;line-height:1.3;}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(170px,100%),1fr));gap:6px;}
.sw-card{background:rgba(0,0,0,.4);border:1px solid rgba(99,102,241,.35);border-radius:9px;padding:9px;}
.sw-title{font-family:'Fredoka One',cursive;font-size:.7rem;color:#a5b4fc;margin-bottom:3px;}
.sw-body{font-size:.65rem;color:#c7d2fe;line-height:1.5;}

/* ══════════════ QUIZ ══════════════ */
#s-quiz{flex-direction:column;}
.quiz-scroll{flex:1;overflow-y:auto;padding:10px 14px;}
.quiz-title{font-family:'Fredoka One',cursive;font-size:clamp(1.3rem,4vw,1.9rem);
  color:#FFD700;text-shadow:2px 2px 0 #7a4500;text-align:center;margin-bottom:3px;}
.quiz-sub{text-align:center;font-size:.74rem;color:#6ee7b7;margin-bottom:12px;}
.qcard{background:rgba(255,255,255,.04);border:2px solid rgba(255,215,0,.2);
  border-radius:11px;padding:12px 14px;margin-bottom:10px;}
.q-num{font-size:.62rem;color:#6b7280;margin-bottom:2px;}
.q-txt{font-family:'Fredoka One',cursive;font-size:clamp(.8rem,2.2vw,.93rem);
  color:#e2e8f0;margin-bottom:8px;line-height:1.45;}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.q-opt{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.15);
  border-radius:8px;padding:8px 10px;font-size:.7rem;color:#d1d5db;cursor:pointer;
  transition:all .15s;text-align:left;font-family:'Nunito',sans-serif;width:100%;}
.q-opt:hover{border-color:#FFD700;background:rgba(255,215,0,.07);}
.q-opt.ok{border-color:#7fff00;background:rgba(92,184,0,.2);color:#7fff00;font-weight:700;}
.q-opt.no{border-color:#ef4444;background:rgba(239,68,68,.15);color:#f87171;}
.q-opt:disabled{cursor:default;}
.q-fb{margin-top:6px;font-size:.7rem;padding:5px 9px;border-radius:7px;display:none;}
.q-fb.show{display:block;}
.q-fb.ok{background:rgba(92,184,0,.15);border:1px solid #5cb800;color:#d4f58a;}
.q-fb.no{background:rgba(239,68,68,.1);border:1px solid #dc2626;color:#fca5a5;}
.quiz-score{background:rgba(255,215,0,.07);border:2px solid #FFD700;border-radius:11px;
  padding:12px;text-align:center;margin-top:10px;display:none;}
.qs-title{font-family:'Fredoka One',cursive;font-size:1.2rem;color:#FFD700;margin-bottom:4px;}
.qs-val{font-family:'Fredoka One',cursive;font-size:2.2rem;color:#7fff00;margin-bottom:5px;}
.qs-msg{font-size:.76rem;color:#d1fae5;line-height:1.5;}

/* POPUP */
#popup{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:900;display:none;align-items:center;justify-content:center;padding:14px;}
#popup.on{display:flex;}
.pop-box{background:linear-gradient(135deg,#1a3a0a,#2d5a1b);border:2.5px solid #7fff00;
  border-radius:16px;padding:16px 20px;max-width:420px;width:100%;position:relative;
  max-height:80vh;overflow-y:auto;box-shadow:0 0 30px rgba(127,255,0,.22);}
.pop-close{position:absolute;top:8px;right:10px;font-size:1.1rem;cursor:pointer;color:#94a3b8;background:none;border:none;}
.pop-title{font-family:'Fredoka One',cursive;font-size:1.1rem;margin-bottom:5px;color:#7fff00;}
.pop-body{font-size:.74rem;line-height:1.65;color:#d1fae5;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,.2);}
::-webkit-scrollbar-thumb{background:#5cb800;border-radius:3px;}
</style>
